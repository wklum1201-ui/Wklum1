<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO — Kanban Board (Demo)</title>
<style>
/* =========================================================
   Design tokens: palette + spacing scale
   ========================================================= */
:root {
  --c-brand-900: #0b2545;
  --c-brand-700: #13427a;
  --c-brand-600: #1a56a0;
  --c-brand-500: #2468c0;
  --c-brand-100: #e4eefa;
  --c-brand-50:  #f3f7fd;

  --c-bg: #eef2f7;
  --c-surface: #ffffff;
  --c-border: #d4dce7;
  --c-text: #1b2533;
  --c-text-muted: #5a6778;

  --c-critical: #c62828;
  --c-critical-bg: #fdecec;
  --c-high: #c77700;
  --c-high-bg: #fff4e0;
  --c-medium: #2468c0;
  --c-medium-bg: #e4eefa;
  --c-low: #6b7685;
  --c-low-bg: #eef0f3;

  --c-success: #1e7d45;
  --c-warning: #a35b00;
  --c-focus: #ffb703;
  --c-drop: #d6e6fb;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-card: 0 1px 2px rgba(11, 37, 69, 0.08), 0 1px 4px rgba(11, 37, 69, 0.06);
  --shadow-modal: 0 12px 40px rgba(11, 37, 69, 0.3);

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* =========================================================
   Base
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--c-text);
  background: var(--c-bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible {
  outline: 3px solid var(--c-focus);
  outline-offset: 2px;
}
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* =========================================================
   Header + summary strip
   ========================================================= */
.app-header {
  background: linear-gradient(90deg, var(--c-brand-900), var(--c-brand-700));
  color: #fff;
  padding: var(--space-4) var(--space-5);
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-4); flex-wrap: wrap;
}
.wordmark {
  margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.04em;
}
.wordmark span { font-weight: 400; opacity: 0.8; font-size: 14px; letter-spacing: 0; margin-left: var(--space-2); }
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-4); cursor: pointer; font-weight: 600;
}
.btn-primary { background: var(--c-brand-500); color: #fff; }
.btn-primary:hover { background: var(--c-brand-600); }
.btn-primary[disabled] { opacity: 0.6; cursor: progress; }
.btn-light { background: #fff; color: var(--c-brand-900); }
.btn-light:hover { background: var(--c-brand-100); }
.btn-light[data-sending]::after { content: "Sending…"; font-weight: 400; font-size: 12px; color: var(--c-text-muted); }
.btn-ghost { background: transparent; border-color: var(--c-border); color: var(--c-text); }
.btn-ghost:hover { background: var(--c-brand-50); }

.summary {
  display: flex; flex-wrap: wrap; gap: var(--space-2);
  margin: var(--space-4) 0 0; padding: 0; list-style: none;
}
.summary li {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  min-width: 96px;
}
.summary .label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; }
.summary .value { font-size: 20px; font-weight: 700; }
.summary .is-alert { background: rgba(198, 40, 40, 0.35); border-color: rgba(255, 180, 180, 0.5); }
.demo-note { margin: var(--space-3) 0 0; font-size: 12px; opacity: 0.85; }

/* =========================================================
   Filter bar
   ========================================================= */
main { padding: var(--space-4) var(--space-5) var(--space-6); }
.filters {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3);
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
}
.filters h2 { margin: 0 var(--space-2) 0 0; font-size: 14px; align-self: center; }
.field { display: flex; flex-direction: column; gap: var(--space-1); }
.field label { font-size: 12px; font-weight: 600; color: var(--c-text-muted); }
.field input, .field select, .field textarea {
  border: 1px solid var(--c-border); border-radius: var(--radius-sm);
  padding: 6px var(--space-2); background: #fff; min-width: 160px;
}
.field textarea { resize: vertical; min-height: 72px; }
.filter-count { margin-left: auto; font-size: 12px; color: var(--c-text-muted); align-self: center; }

/* =========================================================
   Board + columns
   ========================================================= */
.board {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-4); align-items: start;
}
.column {
  background: #e3e9f1; border: 2px solid transparent;
  border-radius: var(--radius-lg); padding: var(--space-3);
  min-height: 240px; transition: background 0.15s, border-color 0.15s;
}
.column.is-drop-target { background: var(--c-drop); border-color: var(--c-brand-500); border-style: dashed; }
.column-header {
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 0 var(--space-3); padding: 0 var(--space-1);
}
.column-header h2 { margin: 0; font-size: 15px; }
.column-header .hint { display: block; font-size: 11px; color: var(--c-text-muted); font-weight: 400; }
.count-badge {
  background: var(--c-brand-700); color: #fff; border-radius: 999px;
  min-width: 26px; padding: 2px var(--space-2); text-align: center; font-size: 12px; font-weight: 700;
}
.card-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-3); }
.empty { color: var(--c-text-muted); font-size: 12px; text-align: center; padding: var(--space-4) 0; font-style: italic; }

/* =========================================================
   Cards
   ========================================================= */
.card {
  position: relative; background: var(--c-surface);
  border: 1px solid var(--c-border); border-left: 5px solid var(--c-medium);
  border-radius: var(--radius-md); padding: var(--space-3); box-shadow: var(--shadow-card);
  cursor: grab;
}
.card.is-dragging { opacity: 0.45; }
.card[data-priority="Critical"] { border-left-color: var(--c-critical); }
.card[data-priority="High"]     { border-left-color: var(--c-high); }
.card[data-priority="Medium"]   { border-left-color: var(--c-medium); }
.card[data-priority="Low"]      { border-left-color: var(--c-low); }

.card-top { display: flex; align-items: center; gap: var(--space-2); padding-right: 24px; flex-wrap: wrap; }
.task-id { font-family: var(--font-mono); font-size: 11px; color: var(--c-text-muted); }
.card-title { margin: var(--space-2) 0 var(--space-1); font-size: 14px; font-weight: 700; word-wrap: break-word; }
.card-desc { margin: 0 0 var(--space-2); font-size: 12px; color: var(--c-text-muted); word-wrap: break-word; }
.meta { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-2); font-size: 12px; }
.meta dt { color: var(--c-text-muted); }
.meta dd { margin: 0; word-wrap: break-word; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-top: var(--space-2); flex-wrap: wrap; }

.pill, .tag, .overdue {
  display: inline-block; border-radius: 999px; padding: 1px var(--space-2);
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.pill-Critical { background: var(--c-critical-bg); color: var(--c-critical); }
.pill-High     { background: var(--c-high-bg); color: var(--c-high); }
.pill-Medium   { background: var(--c-medium-bg); color: var(--c-medium); }
.pill-Low      { background: var(--c-low-bg); color: var(--c-low); }
.tag { background: var(--c-brand-50); color: var(--c-brand-700); border: 1px solid var(--c-brand-100); font-weight: 600; }
.overdue { background: var(--c-critical-bg); color: var(--c-critical); border: 1px solid #f5c2c2; }

.icon-btn {
  border: 0; background: transparent; cursor: pointer; border-radius: var(--radius-sm);
  color: var(--c-text-muted); line-height: 1;
}
.icon-btn:hover { background: var(--c-brand-50); color: var(--c-text); }
.delete-btn { position: absolute; top: var(--space-2); right: var(--space-2); font-size: 18px; width: 24px; height: 24px; }
.move-btn { font-size: 12px; font-weight: 600; padding: 2px var(--space-2); border: 1px solid var(--c-border); }

.move-menu {
  display: flex; flex-wrap: wrap; gap: var(--space-1);
  margin-top: var(--space-2); padding: var(--space-2);
  background: var(--c-brand-50); border-radius: var(--radius-sm);
}
.move-menu .menu-label { width: 100%; font-size: 11px; color: var(--c-text-muted); }
.move-menu button {
  border: 1px solid var(--c-brand-100); background: #fff; border-radius: var(--radius-sm);
  padding: 2px var(--space-2); font-size: 12px; cursor: pointer;
}
.move-menu button:hover { background: var(--c-brand-100); }

.confirm {
  display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2);
  padding: var(--space-2); background: var(--c-critical-bg); border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600; color: var(--c-critical);
}
.confirm button { border: 1px solid currentColor; background: #fff; border-radius: var(--radius-sm); padding: 1px var(--space-2); cursor: pointer; font-size: 12px; }
.confirm .yes { background: var(--c-critical); color: #fff; border-color: var(--c-critical); }

/* =========================================================
   Add Task modal (native <dialog>)
   ========================================================= */
dialog.modal {
  border: 0; border-radius: var(--radius-lg); padding: 0;
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
  box-shadow: var(--shadow-modal);
}
dialog.modal::backdrop { background: rgba(11, 37, 69, 0.5); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--c-border);
  background: var(--c-brand-50);
}
.modal-head h2 { margin: 0; font-size: 17px; color: var(--c-brand-900); }
.modal-head .icon-btn { font-size: 22px; width: 32px; height: 32px; }
.task-form { padding: var(--space-4) var(--space-5) var(--space-5); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
.form-grid .full { grid-column: 1 / -1; }
.form-grid .field input, .form-grid .field select, .form-grid .field textarea { min-width: 0; width: 100%; }
.req { color: var(--c-critical); }
.error { color: var(--c-critical); font-size: 12px; min-height: 1em; margin: 0; }
.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--c-critical); background: #fffafa; }
.char-count { font-size: 11px; color: var(--c-text-muted); text-align: right; }
.form-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }

/* =========================================================
   Toasts
   ========================================================= */
.toast-region {
  position: fixed; right: var(--space-4); bottom: var(--space-4); z-index: 1000;
  display: flex; flex-direction: column; gap: var(--space-2); max-width: min(380px, calc(100vw - 32px));
}
.toast {
  background: var(--c-brand-900); color: #fff; border-left: 5px solid var(--c-success);
  border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
  box-shadow: var(--shadow-modal); font-weight: 500;
}
.toast-warning { border-left-color: var(--c-high); }
.toast-info { border-left-color: var(--c-brand-500); }

/* =========================================================
   Responsive: stack columns below 768px
   ========================================================= */
@media (max-width: 1100px) and (min-width: 768px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 767px) {
  .app-header, main { padding-left: var(--space-3); padding-right: var(--space-3); }
  .board { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .filters .field { flex: 1 1 140px; }
  .filters .field input, .filters .field select { min-width: 0; width: 100%; }
  .filter-count { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .column { transition: none; }
}
</style>
</head>
<body>

<!-- =========================================================
     Header: wordmark, add button, live summary strip
     ========================================================= -->
<header class="app-header">
  <div class="header-top">
    <h1 class="wordmark">IT PMO <span>Project Board · internal demo</span></h1>
    <button type="button" class="btn btn-light" id="open-add-task">
      <span aria-hidden="true">＋</span> Add Task
    </button>
  </div>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <p class="demo-note">
    <span aria-hidden="true">ⓘ</span>
    Demo mode: tasks are held in memory only. Refreshing the page resets the board to the sample data.
  </p>
</header>

<main>
  <!-- =========================================================
       Filter bar
       ========================================================= -->
  <section class="filters" aria-labelledby="filters-heading">
    <h2 id="filters-heading">Filter</h2>
    <div class="field">
      <label for="filter-project">Project</label>
      <select id="filter-project"><option value="">All projects</option></select>
    </div>
    <div class="field">
      <label for="filter-assignee">Assignee contains</label>
      <input type="search" id="filter-assignee" placeholder="e.g. Tan">
    </div>
    <div class="field">
      <label for="filter-priority">Priority</label>
      <select id="filter-priority"><option value="">All priorities</option></select>
    </div>
    <button type="button" class="btn btn-ghost" id="clear-filters">Clear filters</button>
    <span class="filter-count" id="filter-count" aria-live="polite"></span>
  </section>

  <!-- =========================================================
       Kanban board (columns rendered by renderBoard())
       ========================================================= -->
  <section aria-label="Kanban board">
    <div class="board" id="board"></div>
  </section>
</main>

<!-- =========================================================
     Add Task modal
     ========================================================= -->
<dialog class="modal" id="add-task-dialog" aria-labelledby="add-task-heading">
  <div class="modal-head">
    <h2 id="add-task-heading">Add Task</h2>
    <button type="button" class="icon-btn" id="close-add-task" aria-label="Close Add Task form">×</button>
  </div>
  <form class="task-form" id="task-form" novalidate>
    <div class="form-grid">
      <div class="field full" data-field="title">
        <label for="f-title">Task Title <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="f-title" name="title" maxlength="80" required aria-describedby="err-title">
        <p class="error" id="err-title"></p>
      </div>
      <div class="field full" data-field="description">
        <label for="f-description">Description</label>
        <textarea id="f-description" name="description" maxlength="500" aria-describedby="err-description cnt-description"></textarea>
        <span class="char-count" id="cnt-description">0 / 500</span>
        <p class="error" id="err-description"></p>
      </div>
      <div class="field" data-field="project">
        <label for="f-project">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
        <select id="f-project" name="project" required aria-describedby="err-project"></select>
        <p class="error" id="err-project"></p>
      </div>
      <div class="field" data-field="category">
        <label for="f-category">Category <span class="req" aria-hidden="true">*</span></label>
        <select id="f-category" name="category" required aria-describedby="err-category"></select>
        <p class="error" id="err-category"></p>
      </div>
      <div class="field" data-field="assignee">
        <label for="f-assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="f-assignee" name="assignee" maxlength="60" required aria-describedby="err-assignee">
        <p class="error" id="err-assignee"></p>
      </div>
      <div class="field" data-field="priority">
        <label for="f-priority">Priority</label>
        <select id="f-priority" name="priority" aria-describedby="err-priority"></select>
        <p class="error" id="err-priority"></p>
      </div>
      <div class="field" data-field="dueDate">
        <label for="f-dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
        <input type="date" id="f-dueDate" name="dueDate" required aria-describedby="err-dueDate">
        <p class="error" id="err-dueDate"></p>
      </div>
      <div class="field" data-field="status">
        <label for="f-status">Status</label>
        <select id="f-status" name="status" aria-describedby="err-status"></select>
        <p class="error" id="err-status"></p>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="cancel-add-task">Cancel</button>
      <button type="submit" class="btn btn-primary" id="submit-task">Add Task</button>
    </div>
  </form>
</dialog>

<!-- Toast region: announced politely to screen readers -->
<div class="toast-region" id="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>

<!--
  FormSubmit configuration
  ------------------------
  FormSubmit requires a ONE-TIME ACTIVATION per destination address:
  the first submission sent to FORMSUBMIT_ENDPOINT triggers a confirmation
  email to that address, and no submissions are delivered until the link in
  that email has been clicked. Change the address in FORMSUBMIT_ENDPOINT below.
-->
<script>
"use strict";

/* =========================================================
   CONFIG — change the email address here (one place only)
   ========================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* =========================================================
   Reference data
   ========================================================= */
const STATUSES = [
  { key: "Backlog",     hint: "Logged, not yet scheduled" },
  { key: "In Progress", hint: "Actively being worked" },
  { key: "Blocked",     hint: "Waiting on a dependency, vendor or approval" },
  { key: "Done",        hint: "Completed / closed" },
];
const PROJECTS = [
  "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
  "Data & Analytics", "Infrastructure & Cloud", "Vendor Management",
];
const CATEGORIES = [
  "Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const ID_PREFIX = "UOB-ITPM-";

/* =========================================================
   Date helpers (local time, YYYY-MM-DD strings)
   ========================================================= */
function toIsoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayIso() { return toIsoDate(new Date()); }
function daysFromToday(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return toIsoDate(d);
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}
function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayIso();
}

/* =========================================================
   State — the single source of truth (in memory only)
   ========================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextId: 1,
  ui: { pendingDeleteId: null, moveMenuId: null, draggingId: null },
};

function nextTaskId() {
  return ID_PREFIX + String(state.nextId++).padStart(4, "0");
}

/* Seed data: dates are relative to today so overdue badges stay meaningful */
function seedTasks() {
  const seeds = [
    { title: "Migrate FX pricing service to AWS", description: "Lift-and-shift of the FX rate engine to the AWS landing zone with blue/green cut-over.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Priya Nair", priority: "High", dueDate: daysFromToday(21), status: "In Progress" },
    { title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Apply vendor hotfix to the teller VDI golden image and roll out to all branches.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Marcus Lim", priority: "Critical", dueDate: daysFromToday(-2), status: "Blocked" },
    { title: "UAT sign-off for mobile onboarding release 4.2", description: "Collect business sign-off on eKYC and account-opening journeys.", project: "Digital Channels", category: "Application Development", assignee: "Siti Rahman", priority: "High", dueDate: daysFromToday(5), status: "In Progress" },
    { title: "Core ledger batch window performance tuning", description: "Reduce end-of-day batch runtime by 20% ahead of the core upgrade.", project: "Core Banking Upgrade", category: "Application Development", assignee: "Daniel Tan", priority: "Medium", dueDate: daysFromToday(35), status: "Backlog" },
    { title: "Renew market-data vendor contract", description: "Commercial review and legal redlines for the 3-year renewal.", project: "Vendor Management", category: "Vendor", assignee: "Grace Wong", priority: "Medium", dueDate: daysFromToday(-5), status: "Blocked" },
    { title: "Build customer 360 data mart (phase 1)", description: "Ingest CASA and card data into the analytics lakehouse.", project: "Data & Analytics", category: "Data", assignee: "Arjun Mehta", priority: "Low", dueDate: daysFromToday(60), status: "Backlog" },
    { title: "Regulatory technology risk self-assessment", description: "Complete annual TRM control attestation pack for audit.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Marcus Lim", priority: "High", dueDate: daysFromToday(-10), status: "Done" },
    { title: "Decommission legacy SMS gateway", description: "Switch OTP traffic to the new aggregator and retire old servers.", project: "Digital Channels", category: "Infrastructure", assignee: "Daniel Tan", priority: "Low", dueDate: daysFromToday(-20), status: "Done" },
  ];
  state.tasks = seeds.map((s) => ({ id: nextTaskId(), ...s }));
}

/* =========================================================
   Security helper — escape user strings before HTML insertion
   ========================================================= */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* =========================================================
   Filtering (pure, over the in-memory array)
   ========================================================= */
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter((t) =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* =========================================================
   Rendering
   ========================================================= */
function renderSummary() {
  const tasks = state.tasks;
  const overdue = tasks.filter(isOverdue).length;
  const items = [
    { label: "Total", value: tasks.length },
    ...STATUSES.map((s) => ({ label: s.key, value: tasks.filter((t) => t.status === s.key).length })),
    { label: "Overdue", value: overdue, alert: overdue > 0 },
  ];
  document.getElementById("summary").innerHTML = items.map((i) =>
    `<li class="${i.alert ? "is-alert" : ""}"><span class="label">${escapeHtml(i.label)}</span><span class="value">${i.value}</span></li>`
  ).join("");
}

function renderCard(task) {
  const id = escapeHtml(task.id);
  const overdue = isOverdue(task);
  const confirming = state.ui.pendingDeleteId === task.id;
  const moving = state.ui.moveMenuId === task.id;

  const moveMenu = moving ? `
    <div class="move-menu" role="group" aria-label="Move ${id} to column">
      <span class="menu-label">Move to:</span>
      ${STATUSES.filter((s) => s.key !== task.status).map((s) =>
        `<button type="button" data-action="move-to" data-id="${id}" data-status="${escapeHtml(s.key)}">${escapeHtml(s.key)}</button>`
      ).join("")}
      <button type="button" data-action="move-cancel" data-id="${id}">Cancel</button>
    </div>` : "";

  const confirm = confirming ? `
    <div class="confirm" role="group" aria-label="Confirm delete ${id}">
      <span>Delete?</span>
      <button type="button" class="yes" data-action="delete-yes" data-id="${id}">Yes</button>
      <button type="button" class="no" data-action="delete-no" data-id="${id}">No</button>
    </div>` : "";

  return `
    <li class="card" draggable="true" data-id="${id}" data-priority="${escapeHtml(task.priority)}"
        aria-label="${id}: ${escapeHtml(task.title)}">
      <div class="card-top">
        <span class="task-id">${id}</span>
        <span class="pill pill-${escapeHtml(task.priority)}">${escapeHtml(task.priority)}</span>
        ${overdue ? `<span class="overdue"><span aria-hidden="true">⚠</span> Overdue</span>` : ""}
      </div>
      <button type="button" class="icon-btn delete-btn" data-action="delete" data-id="${id}"
              aria-label="Delete task ${id}">×</button>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      ${task.description ? `<p class="card-desc">${escapeHtml(task.description)}</p>` : ""}
      <dl class="meta">
        <dt>Project</dt><dd>${escapeHtml(task.project)}</dd>
        <dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd>
        <dt>Due</dt><dd><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd>
      </dl>
      <div class="card-foot">
        <span class="tag">${escapeHtml(task.category)}</span>
        <button type="button" class="icon-btn move-btn" data-action="move" data-id="${id}"
                aria-expanded="${moving}" aria-label="Move task ${id} to another column">Move ▸</button>
      </div>
      ${moveMenu}
      ${confirm}
    </li>`;
}

function renderBoard(focusSelector) {
  const visible = applyFilters(state.tasks);
  const board = document.getElementById("board");

  board.innerHTML = STATUSES.map((s) => {
    const colTasks = visible.filter((t) => t.status === s.key);
    const headingId = "col-" + s.key.replace(/\s+/g, "-").toLowerCase();
    return `
      <section class="column" data-status="${escapeHtml(s.key)}" aria-labelledby="${headingId}">
        <div class="column-header">
          <h2 id="${headingId}">${escapeHtml(s.key)}<span class="hint">${escapeHtml(s.hint)}</span></h2>
          <span class="count-badge" aria-label="${colTasks.length} tasks">${colTasks.length}</span>
        </div>
        ${colTasks.length
          ? `<ul class="card-list">${colTasks.map(renderCard).join("")}</ul>`
          : `<p class="empty">No tasks</p>`}
      </section>`;
  }).join("");

  const filtered = visible.length !== state.tasks.length;
  document.getElementById("filter-count").textContent = filtered
    ? `Showing ${visible.length} of ${state.tasks.length} tasks`
    : `Showing all ${state.tasks.length} tasks`;

  renderSummary();

  // Restore keyboard focus after a re-render, if requested
  if (focusSelector) {
    const el = board.querySelector(focusSelector);
    if (el) el.focus();
  }
}

/* =========================================================
   Task operations (mutate state, then re-render)
   ========================================================= */
function addTask(data) {
  const task = { id: nextTaskId(), ...data };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find((t) => t.id === id);
  if (!task || !STATUSES.some((s) => s.key === newStatus) || task.status === newStatus) return false;
  task.status = newStatus;
  state.ui.moveMenuId = null;
  state.ui.pendingDeleteId = null;
  renderBoard(`.move-btn[data-id="${CSS.escape(id)}"]`);
  return true;
}

function deleteTask(id) {
  const idx = state.tasks.findIndex((t) => t.id === id);
  if (idx === -1) return;
  state.tasks.splice(idx, 1);
  state.ui.pendingDeleteId = null;
  if (state.ui.moveMenuId === id) state.ui.moveMenuId = null;
  renderBoard();
  document.getElementById("open-add-task").focus();
  showToast(`Task ${id} deleted.`, "info");
}

/* =========================================================
   Toasts (non-blocking, announced via aria-live)
   ========================================================= */
function showToast(message, type = "success", ms = 4000) {
  const region = document.getElementById("toast-region");
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;
  toast.textContent = message; // textContent: never interpreted as HTML
  region.appendChild(toast);
  setTimeout(() => toast.remove(), ms);
}

/* =========================================================
   FormSubmit integration (AJAX JSON endpoint)
   ========================================================= */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString(),
    }),
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  const json = await res.json();
  // FormSubmit can return HTTP 200 with success:"false" (e.g. not yet activated)
  if (json && String(json.success) === "false") throw new Error(json.message || "FormSubmit rejected the submission");
  return json;
}

/* =========================================================
   Add Task form: validation + submit
   ========================================================= */
function readForm(form) {
  const fd = new FormData(form);
  const get = (k) => String(fd.get(k) ?? "").trim();
  return {
    title: get("title"),
    description: get("description"),
    project: get("project"),
    category: get("category"),
    assignee: get("assignee"),
    priority: get("priority"),
    dueDate: get("dueDate"),
    status: get("status"),
  };
}

function validateTask(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project / workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayIso()) errors.dueDate = "Due date cannot be in the past.";
  if (!STATUSES.some((s) => s.key === data.status)) errors.status = "Choose a status.";
  return errors;
}

function showFormErrors(form, errors) {
  form.querySelectorAll(".field[data-field]").forEach((field) => {
    const name = field.dataset.field;
    const msg = errors[name] || "";
    field.classList.toggle("has-error", Boolean(msg));
    field.querySelector(".error").textContent = msg;
    const input = field.querySelector("input, select, textarea");
    if (msg) input.setAttribute("aria-invalid", "true");
    else input.removeAttribute("aria-invalid");
  });
  const first = Object.keys(errors)[0];
  if (first) form.querySelector(`[name="${first}"]`).focus();
}

function resetForm(form) {
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  showFormErrors(form, {});
  updateCharCount();
}

function updateCharCount() {
  const ta = document.getElementById("f-description");
  document.getElementById("cnt-description").textContent = `${ta.value.length} / 500`;
}

async function handleSubmit(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const submitBtn = document.getElementById("submit-task");
  if (submitBtn.disabled) return;

  const data = readForm(form);
  const errors = validateTask(data);
  if (Object.keys(errors).length) {
    showFormErrors(form, errors);
    return;
  }

  // Optimistic UI: the card appears immediately
  const task = addTask(data);
  resetForm(form);
  document.getElementById("add-task-dialog").close();
  showToast(`Task ${task.id} added to ${task.status}.`, "success");

  // Notification runs in parallel; a failure never breaks the board
  const openBtn = document.getElementById("open-add-task");
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";
  openBtn.setAttribute("aria-busy", "true");
  openBtn.dataset.sending = "true";
  try {
    await notifyNewTask(task);
    showToast(`Email notification sent for ${task.id}.`, "info");
  } catch (err) {
    console.warn(err);
    showToast("Card added locally — email notification failed", "warning", 6000);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Add Task";
    openBtn.removeAttribute("aria-busy");
    delete openBtn.dataset.sending;
  }
}

/* =========================================================
   Board interactions: click delegation (move / delete)
   ========================================================= */
function handleBoardClick(event) {
  const btn = event.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const sel = (cls) => `${cls}[data-id="${CSS.escape(id)}"]`;

  switch (btn.dataset.action) {
    case "move":
      state.ui.moveMenuId = state.ui.moveMenuId === id ? null : id;
      state.ui.pendingDeleteId = null;
      renderBoard(state.ui.moveMenuId ? `.move-menu ${sel("button")}` : sel(".move-btn"));
      break;
    case "move-to":
      if (moveTask(id, btn.dataset.status)) showToast(`${id} moved to ${btn.dataset.status}.`, "info", 2500);
      break;
    case "move-cancel":
      state.ui.moveMenuId = null;
      renderBoard(sel(".move-btn"));
      break;
    case "delete":
      state.ui.pendingDeleteId = id;
      state.ui.moveMenuId = null;
      renderBoard(sel(".confirm .no"));
      break;
    case "delete-yes":
      deleteTask(id);
      break;
    case "delete-no":
      state.ui.pendingDeleteId = null;
      renderBoard(sel(".delete-btn"));
      break;
  }
}

/* Escape closes an open move menu or delete confirmation */
function handleBoardKeydown(event) {
  if (event.key !== "Escape") return;
  const id = state.ui.moveMenuId || state.ui.pendingDeleteId;
  if (!id) return;
  const wasMenu = Boolean(state.ui.moveMenuId);
  state.ui.moveMenuId = null;
  state.ui.pendingDeleteId = null;
  renderBoard(`${wasMenu ? ".move-btn" : ".delete-btn"}[data-id="${CSS.escape(id)}"]`);
}

/* =========================================================
   Native HTML5 drag and drop
   ========================================================= */
function clearDropHighlights() {
  document.querySelectorAll(".column.is-drop-target").forEach((c) => c.classList.remove("is-drop-target"));
}

function initDragAndDrop(board) {
  board.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    state.ui.draggingId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", card.dataset.id);
    card.classList.add("is-dragging"); // transient drag feedback only
  });

  board.addEventListener("dragend", (e) => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("is-dragging");
    state.ui.draggingId = null;
    clearDropHighlights();
  });

  board.addEventListener("dragover", (e) => {
    const column = e.target.closest(".column");
    if (!column || !state.ui.draggingId) return;
    e.preventDefault(); // allow drop
    e.dataTransfer.dropEffect = "move";
    if (!column.classList.contains("is-drop-target")) {
      clearDropHighlights();
      column.classList.add("is-drop-target");
    }
  });

  board.addEventListener("dragleave", (e) => {
    const column = e.target.closest(".column");
    if (column && !column.contains(e.relatedTarget)) column.classList.remove("is-drop-target");
  });

  board.addEventListener("drop", (e) => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain") || state.ui.draggingId;
    state.ui.draggingId = null;
    clearDropHighlights();
    if (moveTask(id, column.dataset.status)) showToast(`${id} moved to ${column.dataset.status}.`, "info", 2500);
  });
}

/* =========================================================
   Initialisation
   ========================================================= */
function fillSelect(select, values, keepFirst) {
  const head = keepFirst ? select.options[0].outerHTML : "";
  select.innerHTML = head + values.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
}

function init() {
  // Populate selects from reference data
  fillSelect(document.getElementById("filter-project"), PROJECTS, true);
  fillSelect(document.getElementById("filter-priority"), PRIORITIES, true);
  const fProject = document.getElementById("f-project");
  fProject.innerHTML = `<option value="">Select…</option>`;
  fillSelect(fProject, PROJECTS, true);
  const fCategory = document.getElementById("f-category");
  fCategory.innerHTML = `<option value="">Select…</option>`;
  fillSelect(fCategory, CATEGORIES, true);
  fillSelect(document.getElementById("f-priority"), PRIORITIES, false);
  fillSelect(document.getElementById("f-status"), STATUSES.map((s) => s.key), false);

  const form = document.getElementById("task-form");
  form.elements.dueDate.min = todayIso();
  resetForm(form);

  // Modal open / close
  const dialog = document.getElementById("add-task-dialog");
  const openBtn = document.getElementById("open-add-task");
  openBtn.addEventListener("click", () => {
    form.elements.dueDate.min = todayIso();
    dialog.showModal();
    form.elements.title.focus();
  });
  const closeDialog = () => dialog.close();
  document.getElementById("close-add-task").addEventListener("click", closeDialog);
  document.getElementById("cancel-add-task").addEventListener("click", closeDialog);
  dialog.addEventListener("close", () => openBtn.focus());

  // Form events
  form.addEventListener("submit", handleSubmit);
  document.getElementById("f-description").addEventListener("input", updateCharCount);

  // Filter events
  const bindFilter = (elId, key, evt) =>
    document.getElementById(elId).addEventListener(evt, (e) => {
      state.filters[key] = e.target.value;
      renderBoard();
    });
  bindFilter("filter-project", "project", "change");
  bindFilter("filter-priority", "priority", "change");
  bindFilter("filter-assignee", "assignee", "input");
  document.getElementById("clear-filters").addEventListener("click", () => {
    state.filters = { project: "", assignee: "", priority: "" };
    document.getElementById("filter-project").value = "";
    document.getElementById("filter-priority").value = "";
    document.getElementById("filter-assignee").value = "";
    renderBoard();
  });

  // Board events (delegated, so they survive re-renders)
  const board = document.getElementById("board");
  board.addEventListener("click", handleBoardClick);
  board.addEventListener("keydown", handleBoardKeydown);
  initDragAndDrop(board);

  seedTasks();
  renderBoard();
}

document.addEventListener("DOMContentLoaded", init);
</script>
